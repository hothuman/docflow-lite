name: Windows portable beta

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'requirements/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/collect_release_licenses.py'
      - 'scripts/package_windows.py'
      - 'scripts/verify_windows_bundle.py'
      - 'launch.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the first v0.1.1 prerelease after all checks'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install Qt GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest -q tests site/tests --junitxml=artifacts/linux-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-results
          path: artifacts/linux-tests.xml
          retention-days: 30

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Build, unpack and execute the frozen EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-checks
          path: |
            artifacts/
            build/windows/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-files
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [linux-tests, windows-build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-files
          path: release
      - name: Publish beta without overwriting an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo 'Release v0.1.1 already exists; refusing to replace its assets.'
            exit 1
          fi
          gh release create v0.1.1 release/* \
            --target "$RELEASE_TARGET" --prerelease \
            --title 'DocFlow Lite v0.1.1 — Windows portable beta' \
            --notes-file docs/release-v0.1.1.md
