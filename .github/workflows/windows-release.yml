name: Windows portable release preparation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - '.gitattributes'
      - 'src/**'
      - 'tests/**'
      - 'packaging/**'
      - 'requirements/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/collect_release_licenses.py'
      - 'scripts/package_windows.py'
      - 'scripts/verify_windows_bundle.py'
      - 'launch.py'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      prepare_draft:
        description: 'Create a draft prerelease after all checks (never publish)'
        type: boolean
        default: false
      stable_approved:
        description: 'Owner approved final stable after GO/NO-GO (draft only)'
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - name: Install Qt GUI system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest -q tests site/tests --junitxml=artifacts/linux-tests.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-results
          path: artifacts/linux-tests.xml
          retention-days: 30

  windows-build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact signed CPython SDK without registry changes
        shell: pwsh
        run: |
          $python = ./scripts/install_build_python.ps1
          $directory = Split-Path $python -Parent
          $directory >> $env:GITHUB_PATH
      - name: Build, unpack and execute the frozen EXE
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-checks
          path: |
            artifacts/
            build/windows/warn-*.txt
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-files
          path: release/*
          if-no-files-found: error
          retention-days: 30

  prepare-draft:
    needs: [linux-tests, windows-build]
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_draft && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-release-files
          path: release
      - name: Prepare versioned draft without replacing any existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ github.sha }}
          GH_REPO: ${{ github.repository }}
          STABLE_APPROVED: ${{ inputs.stable_approved }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]] || { echo 'Unsupported release version'; exit 1; }
          tag="v$version"
          notes="docs/release-$tag.md"
          test -f "$notes"
          approval_args=()
          if [[ "$STABLE_APPROVED" == "true" ]]; then approval_args+=(--stable-approved); fi
          python3 scripts/prepare_github_draft.py --directory release --target "$RELEASE_TARGET" --notes "$notes" --output draft-payload.json "${approval_args[@]}"
          prerelease_args=()
          if python3 -c "import json; raise SystemExit(0 if json.load(open('draft-payload.json'))['prerelease'] else 1)"; then prerelease_args+=(--prerelease); fi
          release_title=$(python3 -c "import json; print(json.load(open('draft-payload.json'))['name'])")
          gh api "repos/$GH_REPO/releases?per_page=100" > existing-releases.json
          RELEASE_TAG="$tag" python3 -c "import json,os; assert not any(r['tag_name']==os.environ['RELEASE_TAG'] for r in json.load(open('existing-releases.json'))), 'Release already exists; refusing replacement'"
          gh release create "$tag" release/* \
            --target "$RELEASE_TARGET" --draft "${prerelease_args[@]}" \
            --title "$release_title" \
            --notes-file "$notes"
