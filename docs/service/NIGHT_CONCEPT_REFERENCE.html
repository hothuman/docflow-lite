function setProduct(el,mode){el.dataset.mode=mode;el.querySelectorAll('[data-product]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.product===mode)));const core=mode==='core';if(el===night){const items=core?[['Таблица XLSX / CSV','Исходные данные','ВХОД'],['Проверка полей','Ваш шаблон и сопоставление','ПРОЦЕСС'],['Комплект DOCX','Результат генерации','ВЫХОД']]:[['Аппарат DEMO-001','Одна история оборудования','АППАРАТ'],['Обращение DEMO-R-002','Работы, суммы и статусы','РЕМОНТ'],['Смета и документы','Связаны с обращением','ФАЙЛЫ']];el.querySelector('.df-route').innerHTML=items.map((x,i)=>'<div class="df-route-stop"><b>'+String(i+1).padStart(2,'0')+'</b><div><strong>'+x[0]+'</strong><small>'+x[1]+'</small></div><span>'+x[2]+'</span></div>').join('')}else{el.querySelector('.df-folder-title').innerHTML=core?'Комплект<br>документов.':'История<br>аппарата.';const names=core?['Исходная таблица','Ваш шаблон','Документы DOCX']:['Приёмка и обращение','Расчёт и смета','Работы и документы'];el.querySelector('.df-folder-entries').innerHTML=names.map((s,i)=>'<div class="df-folder-entry"><b>0'+(i+1)+'</b><span>'+s+'</span></div>').join('')}}

const panels={work:[['Настройка узла','1,5 ч × 1 200,00 ₽','1 800,00 ₽'],['Демонстрационная деталь','2 шт. × 450,25 ₽','900,50 ₽']],estimates:[['Предварительная смета','Учебный расчёт','2 700,50 ₽'],['Окончательная смета','Учебная версия','2 700,50 ₽']],documents:[['Акт приёмки','Форма документа','DOCX'],['Смета','Предварительная / окончательная','DOCX']]};function setSection(key){night.querySelectorAll('[data-section]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.section===key)));night.querySelector('.df-panelbody').innerHTML=panels[key].map(x=>'<div class="df-item"><span>'+x[0]+'<br><small>'+x[1]+'</small></span><strong>'+x[2]+'</strong></div>').join('')+(key==='estimates'?'<p class="df-panelnote">Реальное согласование не проводилось.</p>':'')};night.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>setSection(b.dataset.section)));setSection('work');
function setRecord(key){const previous=key==='previous';album.querySelectorAll('[data-record]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.record===key)));album.querySelector('.df-inspector').innerHTML='<small>ПАСПОРТ ОБРАЩЕНИЯ</small><h3>DEMO-R-00'+(previous?'1':'2')+'</h3><p>Аппарат DEMO-001<br>'+(previous?'Закрыто':'Ожидает запчастей')+'</p><div class="df-inspector-label">СТОИМОСТЬ РАБОТ</div><strong>'+(previous?'1 500,00':'2 700,50')+' ₽</strong><div class="df-paper-action">Связано с историей аппарата ↗</div><div class="df-barcode" aria-hidden="true"></div>'};album.querySelectorAll('[data-record]').forEach(b=>b.addEventListener('click',()=>setRecord(b.dataset.record)));setRecord('current');album.querySelector('.df-select-first').addEventListener('click',()=>setRecord('current'));
root.querySelectorAll('.df-watch').forEach(b=>b.addEventListener('click',()=>b.closest('.df-product').querySelector('.df-app').scrollIntoView({behavior:'instant',block:'nearest'})));night.querySelector('.df-switch').addEventListener('click',()=>setProduct(night,night.dataset.mode==='core'?'service':'core'));
if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});
[[night,'#c2ef92'],[album,'#b83d1c']].forEach(([el,accent])=>{const state={accent,detail:true};function render(){el.style.setProperty('--df-accent',state.accent);el.style.setProperty('--df-detail',state.detail?'1':'0');el.classList.toggle('df-reduced-detail',!state.detail)}render();if(globalThis.Tweak){const tweak=new Tweak({container:el,onChange:render});tweak.addColorPicker(state,'accent',{label:'Акцент',reference:'--df-accent'});tweak.addToggle(state,'detail',{label:'Технические детали'})}});
