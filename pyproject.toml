[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-lite"
version = "0.2.0rc1"
description = "Local XLSX/CSV to DOCX batch generation with strict text placeholders"
requires-python = ">=3.11,<3.14"
dependencies = ["python-docx==1.2.0", "openpyxl==3.1.5", "defusedxml==0.7.1", "lxml==6.1.3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.10.2"]
dev = ["pytest==9.0.3"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
docflow = "docflow.cli:main"
docflow-gui = "docflow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docflow = ["examples/*", "ui/*.qss", "ui/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

