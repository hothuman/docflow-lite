[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "docflow-lite"
version = "0.3.0a6"
readme = "README.md"
license = "LicenseRef-DocFlow"
license-files = ["LICENSE.txt"]
authors = [{name = "Гапоненко Ростислав Дмитриевич"}]
description = "Local DOCX generation and single-user equipment repair journal"
requires-python = ">=3.11,<3.14"
dependencies = ["python-docx==1.2.0", "openpyxl==3.1.5", "defusedxml==0.7.1", "lxml==6.1.3"]

[project.optional-dependencies]
gui = ["PySide6-Essentials==6.10.2"]
dev = ["pytest==9.0.3"]
build = ["pyinstaller==6.22.3"]

[project.scripts]
docflow = "docflow.cli:main"
docflow-gui = "docflow.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docflow = ["examples/*", "ui/*.qss", "ui/*.ico", "service/resources/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
